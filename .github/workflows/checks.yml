# Checks every change to dev and main: the plugins' C files keep their format, and OpenECS's dev is checked out with its submodules, this repository's commit is put in its std/ folder,
# OpenECS is built in Debug and Release with this repository and the examples, and the examples' tests run, on SDL's offscreen driver and on Wayland: the examples are the tests of these plugins.
name: Checks

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# a new push to a branch or a pull request cancels its older run, whose result no longer counts
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    env:
      CLANG_FORMAT: clang-format-18
    steps:
      - uses: actions/checkout@v4

      # the C files must be as clang-format 18, Ubuntu 24.04's, writes them; agents format them with check.sh
      - name: Install clang-format
        run: sudo apt-get install -y clang-format-18

      - name: Check the C files' format
        run: .github/scripts/format.sh

  debug-linux:
    name: Debug (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: omerfuyar/OpenECS
          ref: dev
          submodules: recursive

      # the plugins compile the libraries of this repository's own submodules in
      - uses: actions/checkout@v4
        with:
          path: std
          submodules: recursive

      - name: Install the build tools
        run: .github/scripts/install-linux.sh

      # OpenECS's dependencies are built only when their library is missing, so they are kept until a submodule or OpenECS's build changes;
      # the plugins are compiled every time, so the analyzer sees all of them
      - name: Name the dependencies' versions
        id: dependencies
        run: echo "key=$( (git submodule status --recursive dependencies; sha256sum shuild.c dependencies/other/*/*) | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the built dependencies
        uses: actions/cache@v4
        with:
          path: |
            .shu/Debug/dependencies
          key: debug-linux-${{ steps.dependencies.outputs.key }}

      # std builds glslang and SPIRV-Cross with CMake only when their archives are missing, so they are kept until they or std's build change
      - name: Name the C++ libraries' versions
        id: cpp
        run: echo "key=$( (git -C std submodule status dependencies/glslang dependencies/SPIRV-Cross; sha256sum std/shuild.c) | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the C++ libraries
        uses: actions/cache@v4
        with:
          path: |
            std/.shu/Debug/cmake
          key: cpp-debug-linux-${{ steps.cpp.outputs.key }}

      - name: Build with the static analyzer
        run: .github/scripts/build.sh D

      - name: Run the examples' tests with the sanitizers
        run: .github/scripts/test.sh

      # on Wayland, popups and pop-out windows are windows of their own, which the offscreen driver does not have
      - name: Run the examples' tests on Wayland
        run: .github/scripts/test-wayland.sh

      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-linux-logs
          path: build/*.log

  release-linux:
    name: Release (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: omerfuyar/OpenECS
          ref: dev
          submodules: recursive

      # the plugins compile the libraries of this repository's own submodules in
      - uses: actions/checkout@v4
        with:
          path: std
          submodules: recursive

      - name: Install the build tools
        run: .github/scripts/install-linux.sh

      # OpenECS's dependencies are built only when their library is missing, so they are kept until a submodule or OpenECS's build changes;
      # the plugins are compiled every time, so the analyzer sees all of them
      - name: Name the dependencies' versions
        id: dependencies
        run: echo "key=$( (git submodule status --recursive dependencies; sha256sum shuild.c dependencies/other/*/*) | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the built dependencies
        uses: actions/cache@v4
        with:
          path: |
            .shu/Release/dependencies
          key: release-linux-${{ steps.dependencies.outputs.key }}

      # std builds glslang and SPIRV-Cross with CMake only when their archives are missing, so they are kept until they or std's build change
      - name: Name the C++ libraries' versions
        id: cpp
        run: echo "key=$( (git -C std submodule status dependencies/glslang dependencies/SPIRV-Cross; sha256sum std/shuild.c) | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the C++ libraries
        uses: actions/cache@v4
        with:
          path: |
            std/.shu/Release/cmake
          key: cpp-release-linux-${{ steps.cpp.outputs.key }}

      - name: Build
        run: .github/scripts/build.sh R

  windows:
    name: Windows
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
        with:
          repository: omerfuyar/OpenECS
          ref: dev
          submodules: recursive

      # the plugins compile the libraries of this repository's own submodules in
      - uses: actions/checkout@v4
        with:
          path: std
          submodules: recursive

      # LLVM-MinGW with the UCRT runtime, which OpenECS is built with, and CMake and Ninja for SDL
      - name: Install the build tools
        shell: pwsh
        run: .github/scripts/install-windows.ps1

      # SDL's DLLs are installed into bin/, beside the executable, and lib/ has their import libraries
      - name: Name the dependencies' versions
        id: dependencies
        run: echo "key=$( (git submodule status --recursive dependencies; sha256sum shuild.c dependencies/other/*/*) | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the built dependencies
        uses: actions/cache@v4
        with:
          path: |
            .shu/Debug/dependencies
            .shu/Release/dependencies
          key: windows-${{ steps.dependencies.outputs.key }}

      # std builds glslang and SPIRV-Cross with CMake only when their archives are missing, so they are kept until they or std's build change
      - name: Name the C++ libraries' versions
        id: cpp
        run: echo "key=$( (git -C std submodule status dependencies/glslang dependencies/SPIRV-Cross; sha256sum std/shuild.c) | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the C++ libraries
        uses: actions/cache@v4
        with:
          path: |
            std/.shu/Debug/cmake
            std/.shu/Release/cmake
          key: cpp-windows-${{ steps.cpp.outputs.key }}

      - name: Build Debug with LLVM-MinGW
        run: .github/scripts/build.sh D

      - name: Run the examples' tests
        run: .github/scripts/test.sh

      - name: Build Release with LLVM-MinGW
        run: .github/scripts/build.sh R

      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs
          path: build/*.log

  lua:
    name: Lua (LuaLS)
    runs-on: ubuntu-24.04
    env:
      LUALS_VERSION: 3.15.0
    steps:
      - uses: actions/checkout@v4
        with:
          repository: omerfuyar/OpenECS
          ref: dev
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          path: std

      - name: Install the Lua language server
        run: |
          mkdir -p "$RUNNER_TEMP/luals"
          curl -sSL "https://github.com/LuaLS/lua-language-server/releases/download/$LUALS_VERSION/lua-language-server-$LUALS_VERSION-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP/luals"

      # the check reads OpenECS's ecs.lua as a library, so it finds code that misuses the ecs module
      - name: Check the Lua files
        run: |
          echo '{ "workspace.library": ["../include"] }' > std/.luarc.json
          "$RUNNER_TEMP/luals/bin/lua-language-server" --check="$GITHUB_WORKSPACE/std" --checklevel=Warning --logpath="$RUNNER_TEMP/luals-log" | tee luals.log
          grep -q "no problems found" luals.log
