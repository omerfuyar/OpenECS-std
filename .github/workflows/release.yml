# Makes a release from a version tag on main, such as v0.5.0, with OpenECS's release of the same version: for each platform, the plugins,
# built in Release with OpenECS checked out at the same tag; the source with its submodules; and checksums.
# OpenECS's tag is pushed first, as the build checks it out. The release is a draft, so its description can be checked before it is published.
# Run by hand, it builds with OpenECS's dev and makes the same packages without a release, to try them.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            install: .github/scripts/install-linux.sh
          - platform: windows-x86_64
            runner: windows-2025
            install: pwsh -File .github/scripts/install-windows.ps1
    runs-on: ${{ matrix.runner }}
    # Git Bash on Windows
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: omerfuyar/OpenECS
          ref: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          path: std
          submodules: recursive

      # OpenECS's version.sh fails when the tag names another version than OpenECS's
      - name: Find the version
        run: echo "VERSION=$(.github/scripts/version.sh)" >> "$GITHUB_ENV"

      - name: Install the build tools
        run: ${{ matrix.install }}

      - name: Build
        run: .github/scripts/build.sh R

      - name: Package
        run: .github/scripts/package-repository.sh std "$VERSION" "${{ matrix.platform }}"

      - uses: actions/upload-artifact@v4
        with:
          name: openecs-std-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  source:
    name: Source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # GitHub's own source archives leave the submodules out, so they cannot be built
      - name: Package the source with its submodules
        run: |
          name="openecs-std-${GITHUB_REF_NAME#v}-source"
          mkdir -p dist
          git ls-files --recurse-submodules -z | tar --null -T - --transform "s,^,$name/," -czf "dist/$name.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: openecs-std-source
          path: dist/*.tar.gz

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write the checksums
        run: cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS

      # the description is .github/release-notes/TAG.md; a version below 1.0.0, or with a suffix such as -rc.1, is a pre-release
      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes=".github/release-notes/$tag.md"
          test -f "$notes" || { echo "$notes is missing."; exit 1; }
          prerelease=""
          case "$tag" in v0.* | *-*) prerelease="--prerelease" ;; esac
          gh release create "$tag" dist/* --draft $prerelease --title "OpenECS-std ${tag#v}" --notes-file "$notes"
